name: Latest dependencies

# The test jobs install under requirements/ci-pins.txt, so a red run there
# comes from the code. This workflow installs the newest releases instead,
# weekly and on demand, to show what the next bump of the pins would
# break (torch 2.15 once broke a test that passed on the pinned 2.7.1).
# It is never a required check: a failure here is a report to act on by
# fixing the code or holding a pin, not a block on merging.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: latest-deps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-latest:
    name: Fast tests on the newest releases — Python 3.13 / ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e "packages/pyapprox[fem,umbridge,test,torch,jax]" -e packages/pyapprox-benchmarks
      - name: Versions installed
        run: python -m pip list
      - name: Run fast tests
        run: pytest -n 4 --dist loadfile -v --tb=short --timeout=300
