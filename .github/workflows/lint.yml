name: Lint

on:
  push:
    branches: [main, "dev/**"]
  pull_request:
    branches: [main, "dev/**"]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      # The whole tree, not just the source directories. Checking only
      # pyapprox let 20 findings accumulate in pyapprox-benchmarks;
      # checking only the two source trees then hid 128 more in tests,
      # tutorials and scripts -- including a test class declared twice,
      # which silently stopped six tests from being collected at all. A
      # linter that reads a fraction of the tree reports on a fraction of
      # the tree.
      #
      # scripts/ is named by its tracked Python file rather than as a
      # directory: .gitignore holds scripts/* with a few negations, so the
      # rest is local scratch a fresh checkout never sees. Naming the
      # directory would make this command noisy to run locally -- ruff
      # honors .gitignore for a directory but not for a path given
      # explicitly -- while staying green here.
      - run: >
          ruff check
          packages/
          tests/
          scripts/check_prompt_injection.py
          conftest.py

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Every package whose types move the ratchet counts in
      # ratchet_baselines.txt is pinned in requirements/ci-pins.txt, the
      # constraints the dev envs install under too (make dev-env), so the
      # counts mean the same thing in CI and locally. Full runtime extras
      # + benchmarks WITH deps: optional packages (skfem, numba, ...) must
      # be visible to mypy or their typed code is silently unchecked
      # (Any). torch comes first from the CPU-only index, at its pin.
      - run: |
          pip install -c requirements/ci-pins.txt torch --index-url https://download.pytorch.org/whl/cpu
          pip install -c requirements/ci-pins.txt -e "packages/pyapprox[lint,runtime-extras]"
          pip install -c requirements/ci-pins.txt -e packages/pyapprox-benchmarks
      - name: mypy ratchet (must not exceed baseline)
        run: bash scripts/mypy_diff.sh "$(sed -n 's/^mypy_src=//p' ratchet_baselines.txt)" packages/pyapprox/src/pyapprox/
      - name: mypy ratchet for pyapprox-benchmarks
        run: bash scripts/mypy_diff.sh "$(sed -n 's/^mypy_benchmarks=//p' ratchet_baselines.txt)" packages/pyapprox-benchmarks/src/pyapprox_benchmarks/
      # Moved modules: references to old paths must not exceed their
      # moved:<prefix> baselines in ratchet_baselines.txt, and the type
      # stubs at the old paths must match pyapprox._moved.MOVED. This is
      # the gate; the added-lines pre-commit hook is only a local early
      # warning, since hooks are not installed on every checkout.
      - name: moved-module ratchet
        run: python -m pyapprox._moved_ratchet
      - name: moved-module stubs in sync
        run: python -m pyapprox._moved_stubs --check
      # Calls to superseded backend methods (any_bool, ...) must equal
      # their superseded-method:<name> baselines in ratchet_baselines.txt.
      - name: superseded-method ratchet
        run: python -m pyapprox._superseded_ratchet
      # Test modules importing torch, jax or numba at module level without
      # skipping first must not exceed their optional-test-import:<lib>
      # baselines in ratchet_baselines.txt.
      - name: optional-import ratchet
        run: python -m pyapprox._optional_import_ratchet

