name: Lint

on:
  push:
    branches: [main, "dev/**"]
  pull_request:
    branches: [main, "dev/**"]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      # The whole tree, not just the source directories. Checking only
      # pyapprox let 20 findings accumulate in pyapprox-benchmarks;
      # checking only the two source trees then hid 128 more in tests,
      # tutorials and scripts -- including a test class declared twice,
      # which silently stopped six tests from being collected at all. A
      # linter that reads a fraction of the tree reports on a fraction of
      # the tree.
      #
      # scripts/ is named by its tracked Python file rather than as a
      # directory: .gitignore holds scripts/* with a few negations, so the
      # rest is local scratch a fresh checkout never sees. Naming the
      # directory would make this command noisy to run locally -- ruff
      # honors .gitignore for a directory but not for a path given
      # explicitly -- while staying green here.
      - run: >
          ruff check
          packages/
          tests/
          scripts/check_prompt_injection.py
          conftest.py

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Pin the type-relevant toolchain to the versions the local dev envs
      # run, so the ratchet counts in ratchet_baselines.txt mean the same
      # thing in CI and locally. Full runtime extras + benchmarks WITH
      # deps: optional packages (skfem, numba, ...) must be visible to
      # mypy or their typed code is silently unchecked (Any).
      - run: |
          pip install "mypy==1.19.1" "numpy==2.3.5"
          pip install "torch==2.7.1" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e "packages/pyapprox[lint,runtime-extras]"
      - run: pip install -e packages/pyapprox-benchmarks
      # Re-pin EVERY package whose type stubs or inline types influence
      # the error count: the editable installs above resolve unpinned
      # (latest) versions, and stub changes between releases move the
      # ratchet counts (observed: matplotlib, mpire). Bump these pins
      # together with the local conda envs, adjusting the baselines in
      # the same commit when the count moves.
      - run: >
          pip install "numpy==2.3.5" "scipy==1.16.3" "matplotlib==3.10.8"
          "sympy==1.14.0" "scikit-fem==11.0.0" "numba==0.62.1"
          "joblib==1.5.2" "mpire==2.10.2"
      - name: mypy ratchet (must not exceed baseline)
        run: bash scripts/mypy_diff.sh "$(sed -n 's/^mypy_src=//p' ratchet_baselines.txt)" packages/pyapprox/src/pyapprox/
      - name: mypy ratchet for pyapprox-benchmarks
        run: bash scripts/mypy_diff.sh "$(sed -n 's/^mypy_benchmarks=//p' ratchet_baselines.txt)" packages/pyapprox-benchmarks/src/pyapprox_benchmarks/

