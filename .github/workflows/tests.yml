name: Tests

on:
  push:
    branches: [main, "dev/**"]
  pull_request:
    branches: [main, "dev/**"]
  workflow_dispatch:
    inputs:
      tier:
        # The slow tiers never run on a dev/** push, so a dispatch is
        # the only way to reach them before a branch merges to main.
        # Defaulting to slow reflects that: the fast tiers already ran
        # on the push that prompted the dispatch, and re-running them
        # would spend six runners repeating a known result.
        description: "Which tests to run"
        type: choice
        default: slow
        options:
          - all
          - fast
          - slow
          # fast without the minimal-install job. That job runs the same
          # tests again in an environment without the optional extras,
          # which is worth having on a push and is noise when chasing one
          # failure: it has no matrix to narrow, so it cannot be reduced
          # by the os and python inputs the way the fast jobs can.
          - fast-only
      tests:
        # For reproducing a failure that only happens here. Without this
        # the only way to see one CI test again is the whole suite, ten
        # minutes a time, which is slow enough to discourage checking
        # whether a fix actually worked. Passed through to pytest, so it
        # takes paths, node ids, or a -k expression.
        #
        # Empty by default, and the default is what every push uses, so
        # the normal run is unchanged. Remember to set tier=fast: the
        # tier default is slow, which skips the fast jobs entirely.
        description: "Paths, node ids or -k expression (empty runs all)"
        type: string
        default: ""
      os:
        # Narrow the fast matrix when only one platform fails. The other
        # five jobs confirm what is already known, and macOS minutes bill
        # at ten times Linux on a private repository, so a run restricted
        # to the platform in question is both quicker to read and far
        # cheaper. Defaults to both, which is what every push uses.
        description: "Fast-job platforms"
        type: choice
        default: both
        options:
          - both
          - ubuntu-latest
          - macos-latest
      python:
        # Same reasoning for the interpreter. A failure that only appears
        # on 3.11 needs 3.11, not three versions of the same answer.
        description: "Fast-job Python versions"
        type: choice
        default: all
        options:
          - all
          - "3.11"
          - "3.12"
          - "3.13"

concurrency:
  # Keyed on the event as well as the ref, so a dispatched run and a
  # pushed one on the same branch are independent. Without the event a
  # dispatch joins the push's group and cancels it: debugging one test
  # on dev/main threw away a full suite that was ten minutes in.
  #
  # Push still supersedes push, which is the behavior worth keeping --
  # results for a commit that has been overtaken are not worth the
  # runners. Dispatch still supersedes dispatch on the same ref, so
  # firing a second experiment before the first finishes loses the
  # first; use a separate debug/* branch per question if that matters.
  group: tests-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  fast:
    name: Fast — Python ${{ matrix.python-version }} / ${{ matrix.os }}
    if: >-
      github.event_name != 'workflow_dispatch'
      || contains(fromJSON('["all","fast","fast-only"]'), inputs.tier)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Taken from an expression so a dispatch can narrow it; the
      # defaults reproduce the full matrix, which is what every push
      # gets. A matrix cannot be filtered by an input directly, so each
      # axis is a JSON list chosen by its input.
      # Written as "narrow && one || all" rather than the more obvious
      # "is-default || all || one": && binds tighter than ||, so the
      # latter returns the comparison's own true value on a push, where
      # the input is null, and fromJSON(true) then fails.
      matrix:
        python-version: >-
          ${{ fromJSON((inputs.python && inputs.python != 'all')
          && format('["{0}"]', inputs.python)
          || '["3.11","3.12","3.13"]') }}
        os: >-
          ${{ fromJSON((inputs.os && inputs.os != 'both')
          && format('["{0}"]', inputs.os)
          || '["ubuntu-latest","macos-latest"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('packages/*/pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-${{ matrix.python-version }}-
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e "packages/pyapprox[fem,umbridge,test]" -e packages/pyapprox-benchmarks
      - name: Run fast tests (PR — fail-fast)
        if: github.event_name == 'pull_request'
        run: pytest -n 4 --dist loadfile -v --tb=short --timeout=300 ${{ inputs.tests }}
      - name: Run fast tests (push — show all failures)
        if: github.event_name != 'pull_request'
        run: pytest -n 4 --dist loadfile -v --tb=short --timeout=300 ${{ inputs.tests }}

  minimal:
    name: Minimal install (no optional deps)
    # Grouped with fast rather than the slow tiers: this runs the same
    # fast tests, only in an environment without the optional extras.
    if: >-
      github.event_name != 'workflow_dispatch'
      || contains(fromJSON('["all","fast"]'), inputs.tier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: Linux-pip-3.12-minimal-${{ hashFiles('packages/*/pyproject.toml') }}
          restore-keys: Linux-pip-3.12-minimal-
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e "packages/pyapprox[test]" -e packages/pyapprox-benchmarks
      - name: Verify package imports
        run: python -c "import pyapprox; print('Core import OK')"
      - name: Run fast tests (no optional deps)
        run: pytest -n 4 --dist loadfile -v --tb=short --timeout=300 ${{ inputs.tests }}

  slow:
    name: Slow tests (>5s)
    if: >-
      (github.event_name == 'workflow_dispatch'
        && contains(fromJSON('["all","slow"]'), inputs.tier))
      || github.ref == 'refs/heads/main'
      || (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: Linux-pip-3.12-${{ hashFiles('packages/*/pyproject.toml') }}
          restore-keys: Linux-pip-3.12-
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e "packages/pyapprox[fem,umbridge,test]" -e packages/pyapprox-benchmarks
      - name: Run slow tests only
        env:
          PYAPPROX_RUN_SLOW: "1"
        run: pytest -n 4 --dist loadfile -v --tb=short -m slow_on --timeout=600 ${{ inputs.tests }}

  slower:
    name: Slower tests (>30s)
    if: >-
      (github.event_name == 'workflow_dispatch'
        && contains(fromJSON('["all","slow"]'), inputs.tier))
      || github.ref == 'refs/heads/main'
      || (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: Linux-pip-3.12-${{ hashFiles('packages/*/pyproject.toml') }}
          restore-keys: Linux-pip-3.12-
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e "packages/pyapprox[fem,umbridge,test]" -e packages/pyapprox-benchmarks
      - name: Run slower tests only
        env:
          PYAPPROX_RUN_SLOWER: "1"
        run: pytest -n 4 --dist loadfile -v --tb=short -m slower_on --timeout=1200 ${{ inputs.tests }}

  slowest:
    name: Slowest tests (>60s)
    if: >-
      (github.event_name == 'workflow_dispatch'
        && contains(fromJSON('["all","slow"]'), inputs.tier))
      || github.ref == 'refs/heads/main'
      || (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: Linux-pip-3.12-${{ hashFiles('packages/*/pyproject.toml') }}
          restore-keys: Linux-pip-3.12-
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e "packages/pyapprox[fem,umbridge,test]" -e packages/pyapprox-benchmarks
      - name: Run slowest tests only
        env:
          PYAPPROX_RUN_SLOWEST: "1"
        run: pytest -n 4 --dist loadfile -v --tb=short -m slowest_on --timeout=1800 ${{ inputs.tests }}
