repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/PyCQA/bandit
    rev: "1.8.3"
    hooks:
      - id: bandit
        args: ["-r", "--severity-level", "high", "--exclude", "tests/,packages/pyapprox-tutorials/"]

  - repo: https://github.com/pypa/pip-audit
    rev: v2.9.0
    hooks:
      - id: pip-audit

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: no-commit-to-branch
        args: ["--branch", "main", "--branch", "dev/main"]

  - repo: local
    hooks:
      # Old paths of moved modules, and uses of superseded packages, may
      # stay where they are, but no commit adds one; see
      # pyapprox/_moved_ratchet.py.
      - id: moved-module-old-paths
        name: no old paths of moved modules or superseded packages on added lines
        entry: python -m pyapprox._moved_ratchet --staged
        language: system
        pass_filenames: false
        always_run: true
