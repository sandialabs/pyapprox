name: pyapprox
# Conda supplies Python; every Python package then comes from pip, from
# the packages' pyproject.toml, so no package is installed twice by two
# tools.
#
# No OpenMP package: the PyTorch wheel ships its own OpenMP runtime and
# header, and torch.compile's CPU kernels build and link against those.
# A second OpenMP runtime in the env (conda's llvm-openmp, Homebrew's
# libomp) gets loaded beside torch's and aborts the process with
# "OMP: Error #15" once both initialize, e.g. a torch.compile reduction
# or a numba parallel loop.
#
#   conda env create -f environment.yml
#   conda activate pyapprox
#   make install-dev
#
# conda-forge only: it carries native builds for every platform and has
# no usage terms beyond each package's own license.
channels:
  - conda-forge
dependencies:
  - python>=3.12
  - pip
