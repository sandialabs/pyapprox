name: pyapprox
# Conda supplies Python and the native libraries pip cannot install;
# every Python package then comes from pip, from the packages'
# pyproject.toml, so no package is installed twice by two tools.
# llvm-openmp is for torch.compile on CPU, which TorchBkd's compiled
# paths use: it generates C++ with OpenMP pragmas and builds it
# with the system compiler, so the compiler must find omp.h. Apple's
# clang ships no OpenMP, so on macOS this is required. It is not needed
# on Linux, where gcc brings its own OpenMP (libgomp); on a GPU, where
# torch.compile generates Triton kernels instead; or if you use only the
# NumPy backend, or never call torch.compile.
#
#   conda env create -f environment.yml
#   conda activate pyapprox
#   make install-dev
#
# conda-forge only: it carries native builds for every platform and has
# no usage terms beyond each package's own license.
channels:
  - conda-forge
dependencies:
  - python>=3.12
  - pip
  - llvm-openmp
